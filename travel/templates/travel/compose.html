{% extends "travel/base.html" %}
{% block content %}
<section class="flex-1 p-8 overflow-y-auto">
  <form method="post" class="max-w-2xl bg-white rounded-lg border border-slate-200 p-6 space-y-4">
    {% csrf_token %}
    <h1 class="text-lg font-semibold">New email</h1>
    <p class="text-sm text-slate-500">From {{ current.email }} to the travel agent</p>
    <input name="subject" required placeholder="Subject"
           class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
    <textarea name="body" rows="10" required
              placeholder="e.g. I need to fly from SFO to New York on the 24th, back on the 27th. I have a client dinner at 7pm the night I land."
              class="w-full border border-slate-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"></textarea>
    <div class="flex justify-end">
      <button type="submit" data-busy-label="Agent is working…"
              class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded px-4 py-2">Send</button>
    </div>
  </form>
</section>
{% endblock %}
